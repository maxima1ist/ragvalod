apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway
          image: ragvalod/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: GATEWAY_HOST
              value: 0.0.0.0
            - name: GATEWAY_PORT
              value: "8000"
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ragvalod-secrets
                  key: GATEWAY_API_KEY
            - name: GATEWAY_INGESTION_GRPC_ADDR
              value: ingestion-grpc:50051
            - name: GATEWAY_RAG_GRPC_ADDR
              value: rag-orchestrator-grpc:50052
            - name: GATEWAY_LITELLM_BASE_URL
              value: http://litellm:4000
            - name: GATEWAY_LANGFUSE_HOST
              value: http://langfuse:3000
            - name: GATEWAY_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ragvalod-secrets
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: GATEWAY_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ragvalod-secrets
                  key: LANGFUSE_SECRET_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
