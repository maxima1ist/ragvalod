# kind cluster with host NVIDIA devices bind-mounted into the node.
# Requires /dev/nvidia* on the host (see docs/host_gpu_setup.md).
# Recreate: kind delete cluster --name ragvalod-smoke && scripts/kind_create.sh k8s/kind-gpu.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __RAGVALOD_TEST_DATA__
        containerPath: /test_data
      - hostPath: /dev/nvidia0
        containerPath: /dev/nvidia0
      - hostPath: /dev/nvidiactl
        containerPath: /dev/nvidiactl
      - hostPath: /dev/nvidia-uvm
        containerPath: /dev/nvidia-uvm
      - hostPath: /dev/nvidia-uvm-tools
        containerPath: /dev/nvidia-uvm-tools
      - hostPath: /dev/nvidia-caps
        containerPath: /dev/nvidia-caps
      # Lets nvidia-container-runtime inject GPUs if the daemon uses that hook.
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/all
      # Filled by scripts/kind_create.sh from Compose volume ragvalod_hf_cache.
      - hostPath: __RAGVALOD_HF_CACHE__
        containerPath: /hf-cache
