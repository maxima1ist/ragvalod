# Laptop kind + host GPU: Ingress off, LiteLLM local image, vLLM replicas=1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ragvalod
resources:
  - ../../base
images:
  - name: ghcr.io/berriai/litellm
    newName: ragvalod/litellm
    newTag: local
  - name: vllm/vllm-openai
    newName: ragvalod/vllm
    newTag: local
patches:
  - path: delete-ingress.yaml
  - path: vllm-laptop.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ingestion
    path: ingestion-testdata.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllm
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
      - op: remove
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: hf-cache
            hostPath:
              path: /hf-cache
              type: DirectoryOrCreate
          - name: nvidia0
            hostPath:
              path: /dev/nvidia0
          - name: nvidiactl
            hostPath:
              path: /dev/nvidiactl
          - name: nvidia-uvm
            hostPath:
              path: /dev/nvidia-uvm
          - name: nvidia-uvm-tools
            hostPath:
              path: /dev/nvidia-uvm-tools
          - name: libcuda
            hostPath:
              path: /usr/lib/x86_64-linux-gnu/libcuda.so.1
          - name: libnvml
            hostPath:
              path: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
