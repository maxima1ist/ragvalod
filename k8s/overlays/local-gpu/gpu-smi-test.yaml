apiVersion: v1
kind: Pod
metadata:
  name: gpu-smi-test
  namespace: ragvalod
spec:
  restartPolicy: Never
  containers:
    - name: smi
      image: ragvalod/cuda-smi:local
      imagePullPolicy: IfNotPresent
      command: ["/host-nvidia-smi", "-L"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: nvidia-smi
          mountPath: /host-nvidia-smi
        - name: nvidia0
          mountPath: /dev/nvidia0
        - name: nvidiactl
          mountPath: /dev/nvidiactl
        - name: nvidia-uvm
          mountPath: /dev/nvidia-uvm
        - name: libcuda
          mountPath: /usr/lib/x86_64-linux-gnu/libcuda.so.1
        - name: libnvml
          mountPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
  volumes:
    - name: nvidia-smi
      hostPath:
        path: /usr/local/bin/nvidia-smi
    - name: nvidia0
      hostPath:
        path: /dev/nvidia0
    - name: nvidiactl
      hostPath:
        path: /dev/nvidiactl
    - name: nvidia-uvm
      hostPath:
        path: /dev/nvidia-uvm
    - name: libcuda
      hostPath:
        path: /usr/lib/x86_64-linux-gnu/libcuda.so.1
    - name: libnvml
      hostPath:
        path: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
