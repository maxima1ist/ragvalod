# HA overlay without GPU / Ingress — for kind smoke of replica + Redis cache.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ragvalod
resources:
  - ../ha
images:
  - name: ghcr.io/berriai/litellm
    newName: ragvalod/litellm
    newTag: local
patches:
  - path: scale-vllm-off.yaml
  - path: delete-ingress.yaml
