apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ragvalod
resources:
  - ../../base
  - redis.yaml
  - replicas-patch.yaml
configMapGenerator:
  - name: litellm-config
    behavior: replace
    files:
      - config.yaml=../../../configs/litellm.redis.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: litellm-redis-env.yaml
