# One judge pass per hour. The image default is an in-process loop for Compose;
# this CronJob replaces that command so the schedule lives in Kubernetes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: judge
  labels:
    app: judge
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: judge
        spec:
          restartPolicy: OnFailure
          containers:
            - name: judge
              image: ragvalod/judge:latest
              imagePullPolicy: IfNotPresent
              args: ["python", "scripts/judge_traces.py", "--limit", "5"]
              env:
                - name: JUDGE_KEEP_SERVICE_HOSTS
                  value: "1"
                - name: LANGFUSE_HOST
                  value: http://langfuse:3000
                - name: LITELLM_BASE_URL
                  value: http://litellm:4000
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ragvalod-secrets
                      key: LANGFUSE_PUBLIC_KEY
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ragvalod-secrets
                      key: LANGFUSE_SECRET_KEY
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ragvalod-secrets
                      key: LITELLM_MASTER_KEY
