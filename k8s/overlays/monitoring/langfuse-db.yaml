apiVersion: v1
kind: Service
metadata:
  name: langfuse-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: langfuse-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-db
spec:
  serviceName: langfuse-db
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-db
  template:
    metadata:
      labels:
        app: langfuse-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ragvalod-secrets
                  key: LANGFUSE_POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: langfuse
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
