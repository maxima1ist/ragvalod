# LiteLLM with Redis-backed response cache (multi-replica).
# Mount instead of litellm.yaml when Redis is available:
#   volumes:
#     - ./configs/litellm.redis.yaml:/app/config.yaml:ro
# Set REDIS_HOST / REDIS_PORT in litellm service environment.

model_list:
  - model_name: chat-default
    litellm_params:
      model: hosted_vllm/Qwen/Qwen2.5-7B-Instruct-AWQ
      api_base: http://vllm:8000/v1
      api_key: "none"
  # Judge only. Must stay a different model from chat-default.
  # judge-fallback is used by scripts/judge_traces.py when the free Qwen pool returns 429.
  - model_name: judge-default
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: judge-fallback
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: embedder-default
    litellm_params:
      model: openai/intfloat/multilingual-e5-small
      api_base: http://infinity:7997
      api_key: "none"
  - model_name: reranker-default
    litellm_params:
      model: infinity/BAAI/bge-reranker-v2-m3
      api_base: http://infinity:7997
      api_key: "none"

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
