# Langfuse LLM-as-a-judge evaluators for ragvalod (deferred, step D.1).
#
# STATUS 2026-08-06: managed LLM-as-a-judge UI is NOT available on
# langfuse/langfuse:2 (2.95 OSS) — entitlements playground /
# model-based-evaluations are cloud-only in that build. Project Settings
# "API Keys" (pk-lf-… / sk-lf-…) are for TRACE INGEST only, not LLM Connections.
# Revisit (step D.1): upgrade to Langfuse v3 or external judge
# script via LiteLLM + scores API.
#
# No custom judge code (when UI exists): configure these in the Langfuse UI
# (Evaluators) or via Langfuse's managed catalog (Ragas partnership). Point the
# Langfuse LLM connection at LiteLLM so the judge uses the same model gateway:
#
#   base_url: http://litellm:4000/v1   (from Langfuse container network)
#   api_key:  $LITELLM_MASTER_KEY
#   model:    chat-default
#
# Prerequisite: vLLM must expose OpenAI tool calling (compose already sets
# --enable-auto-tool-choice --tool-call-parser hermes for Qwen2.5).
# Without that, Langfuse judge fails with tool_choice=auto errors.
#
# Trace field mapping (what RAG Orchestrator writes):
#   {{input}}   ← trace.input.query
#   {{output}}  ← trace.output.answer
#   {{context}} ← trace.metadata.used_chunks[].text (join)
#
# UI steps (when entitlement available; http://localhost:3000, project ragvalod):
# 1) Settings → LLM Connections / LLM API Keys → OpenAI-compatible
#    base http://litellm:4000/v1, key=LITELLM_MASTER_KEY, model chat-default
# 2) Evaluators → create faithfulness / answer_relevancy / context_precision
# 3) Map variables to trace fields above; rule: live traces name=rag.generate
# 4) Run POST /generate → Scores appear on the new trace
#
# Bring up: docker compose --profile monitoring --profile local-llm up -d
# UI:       http://localhost:3000  (admin@ragvalod.local / ragvalod-admin by default)

version: 1

judge_llm:
  provider: litellm
  api_base: http://litellm:4000/v1
  model: chat-default
  # Use LITELLM_MASTER_KEY from .env as the OpenAI-compatible key in Langfuse.

variable_mapping:
  input: trace.input.query
  output: trace.output.answer
  context: trace.metadata.used_chunks

# Ragas-aligned metrics without ground truth (run on live traces).
evaluators:
  - name: faithfulness
    source: ragas
    score_type: numeric
    description: >
      Fraction of answer claims supported by retrieved context.
      No ground-truth answer required.
    variables: [output, context]
    # In Langfuse UI: Evaluators → Ragas / Faithfulness (or equivalent catalog entry).

  - name: answer_relevancy
    source: ragas
    score_type: numeric
    description: >
      How well the answer addresses the user query (answer relevancy).
    variables: [input, output]
    # In Langfuse UI: Evaluators → Ragas / Answer Relevancy.

  - name: context_precision
    source: ragas
    score_type: numeric
    description: >
      Whether retrieved chunks are relevant to the query (context precision).
      Without GT, use the LLM-judge variant that scores context vs question.
    variables: [input, context]
    # In Langfuse UI: Evaluators → Ragas / Context Precision (or Context Relevance).

evaluation_rule:
  target: live_traces
  filter:
    name: rag.generate
  sampling_rate: 1.0
  # Attach all three evaluators to matching traces after mapping variables above.
