[project]
name = "ragvalod-rag-orchestrator"
version = "0.1.0"
description = "RAG Orchestrator — retrieval, rerank, prompt, generate"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.70.0",
    "grpcio-health-checking>=1.70.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "ragvalod-proto",
]

[project.scripts]
ragvalod-rag-orchestrator = "rag_orchestrator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_orchestrator"]

[tool.hatch.build.targets.wheel.sources]
"src/rag_orchestrator" = "rag_orchestrator"

[tool.uv.sources]
ragvalod-proto = { workspace = true }
