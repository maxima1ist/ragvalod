[project]
name = "ragvalod-proto"
version = "0.1.0"
description = "Generated gRPC stubs for ragvalod internal services"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.70.0",
    "protobuf>=5.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragvalod_proto"]
