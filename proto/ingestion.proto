syntax = "proto3";

package ragvalod.ingestion.v1;

option py_generic_services = false;

// Ingestion Service: scrape configured sources, chunk, embed, write to Qdrant.
service IngestionService {
  // Start an async ingest job for one or more sources.
  // Sources without credentials are skipped when all_with_credentials is true.
  rpc TriggerIngest(TriggerIngestRequest) returns (TriggerIngestResponse);

  // Job status including per-source progress / result / error.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);

  // List registered data-source adapters.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
}

message SourceSpec {
  // Adapter name, e.g. "local_files", "notion".
  string name = 1;
  // Opaque credentials for this source (token, API key, etc.). Never persisted in v1.
  map<string, string> credentials = 2;
  // Source-specific options (paths, filters, etc.).
  map<string, string> options = 3;
}

message TriggerIngestRequest {
  // Explicit list of sources to ingest. Ignored when all_with_credentials is true
  // and credentials are provided via the sources list (sources still carry creds).
  repeated SourceSpec sources = 1;
  // If true, ingest every source for which credentials (or no-cred adapters) are present.
  bool all_with_credentials = 2;
}

message TriggerIngestResponse {
  string job_id = 1;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_PARTIAL = 5; // some sources succeeded, some failed
}

enum SourceJobState {
  SOURCE_JOB_STATE_UNSPECIFIED = 0;
  SOURCE_JOB_STATE_PENDING = 1;
  SOURCE_JOB_STATE_RUNNING = 2;
  SOURCE_JOB_STATE_SUCCEEDED = 3;
  SOURCE_JOB_STATE_FAILED = 4;
  SOURCE_JOB_STATE_SKIPPED = 5;
}

message SourceJobStatus {
  string source_name = 1;
  SourceJobState state = 2;
  string message = 3;
  int32 documents_processed = 4;
  int32 chunks_written = 5;
  string error = 6;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id = 1;
  JobState state = 2;
  string message = 3;
  repeated SourceJobStatus sources = 4;
  // ISO-8601 timestamps; empty if not yet set.
  string started_at = 5;
  string finished_at = 6;
}

message ListSourcesRequest {}

message SourceInfo {
  string name = 1;
  string description = 2;
  // Whether the adapter requires credentials to activate.
  bool requires_credentials = 3;
}

message ListSourcesResponse {
  repeated SourceInfo sources = 1;
}
