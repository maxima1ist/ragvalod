[project]
name = "ragvalod-ingestion"
version = "0.1.0"
description = "Ingestion Service — scrape sources, chunk, embed, write to Qdrant"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.70.0",
    "grpcio-health-checking>=1.70.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "ragvalod-proto",
]

[project.scripts]
ragvalod-ingestion = "ingestion.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.hatch.build.targets.wheel.sources]
"src/ingestion" = "ingestion"

[tool.uv.sources]
ragvalod-proto = { workspace = true }
